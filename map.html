<!DOCTYPE html>
<html lang="uk-UA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlan Division — Advanced Strategy Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --panel-bg: rgba(10, 15, 26, 0.95);
            --accent: #38bdf8;
            --text: #e2e8f0;
            --heading: #f8fafc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #070b14; color: var(--text); }

        /* TOP PANEL */
        .topbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: var(--panel-bg); backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(56,189,248,0.25);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 2000; gap: 12px;
        }
        .brand {
            font-weight: 800; font-size: 0.95rem; color: var(--heading);
            letter-spacing: 0.5px; white-space: nowrap; display: flex; align-items: center; gap: 8px;
        }
        .stats { display: flex; gap: 8px; flex-wrap: wrap; }
        .stat {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600;
        }
        .stat span { color: var(--accent); }
        .controls { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn {
            padding: 5px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 700;
            border: 1px solid; cursor: pointer; transition: 0.15s; background: transparent; color: var(--text);
        }
        .btn:hover { filter: brightness(1.2); }
        .btn-blue { border-color: #38bdf8; color: #38bdf8; }
        .btn-blue.active, .btn-blue:hover { background: #38bdf8; color: #000; }
        .btn-green { border-color: #22c55e; color: #22c55e; }
        .btn-green:hover { background: #22c55e; color: #000; }
        .btn-red { border-color: #ef4444; color: #f87171; }
        .btn-grey { border-color: #64748b; color: #94a3b8; }

        #map { width: 100vw; height: 100vh; background: #000; }

        /* POPUPS */
        .leaflet-popup-content-wrapper {
            background: #0f172a !important; color: #f1f5f9 !important;
            border: 1px solid rgba(56,189,248,0.3); border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .leaflet-popup-content h3 { color: #38bdf8; margin-bottom: 6px; font-size: 1rem; }
        .leaflet-popup-content p { margin: 4px 0; font-size: 0.84rem; }
        .pbtn {
            display: block; width: 100%; margin-top: 8px; padding: 7px;
            border: none; border-radius: 5px; font-weight: 700; cursor: pointer; color: #fff; font-size: 0.8rem;
            transition: opacity 0.15s;
        }
        .pbtn:hover { opacity: 0.85; }
        .pbtn-attack { background: #ef4444; }
        .pbtn-entrench { background: #64748b; }

        /* LEGEND */
        .legend {
            position: fixed; bottom: 16px; left: 16px; z-index: 1000;
            background: var(--panel-bg); padding: 10px 14px; border-radius: 8px;
            border: 1px solid rgba(56,189,248,0.2); font-size: 0.78rem;
        }
        .legend div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
        .legend-color { width: 14px; height: 10px; border-radius: 2px; }

        /* MODAL */
        .modal-bg {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            z-index: 3000; align-items: center; justify-content: center;
        }
        .modal-bg.open { display: flex; }
        .modal {
            background: #0f172a; border: 1px solid rgba(56,189,248,0.3);
            border-radius: 12px; padding: 22px; width: 340px; max-width: 90vw;
        }
        .modal h3 { color: #38bdf8; margin-bottom: 14px; }
        .modal label { display: block; margin: 10px 0 4px; font-size: 0.85rem; }
        .modal select, .modal input {
            width: 100%; padding: 7px 10px; border-radius: 6px;
            background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
        }
        .modal-actions { margin-top: 18px; display: flex; gap: 8px; justify-content: flex-end; }
    </style>
</head>
<body>

<header class="topbar">
    <div class="brand">🛡️ CARLAN DIVISION</div>

    <div class="stats">
        <div class="stat">Свої: <span id="friendlyPower">0</span></div>
        <div class="stat">Ворог: <span id="enemyPower">0</span></div>
        <div class="stat">Контроль міст: <span id="citiesGreen">0</span>/22</div>
        <div class="stat">Час: <span id="gameTime">00:00</span></div>
    </div>

    <div class="controls">
        <button class="btn btn-blue" id="btnMove" onclick="setMode('move')">Переміщення</button>
        <button class="btn btn-grey" onclick="openSettings()">⚙️ Налаштування</button>
        <button class="btn btn-green" onclick="endTurn()">⏭ Наступний хід</button>
    </div>
</header>

<div id="map"></div>

<div class="legend">
    <div><div class="legend-color" style="background:#166534;"></div> ЗСУ</div>
    <div><div class="legend-color" style="background:#334155;"></div> Сіра зона</div>
    <div><div class="legend-color" style="background:#7f1d1d;"></div> Окуповано</div>
    <div style="margin-top:6px; font-size:0.72rem; opacity:0.8;">Клікни місто для деталей<br>Перетягуй юніти для атак</div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-bg" id="settingsModal">
    <div class="modal">
        <h3>Системні налаштування</h3>
        <label>Радіус впливу міст</label>
        <select id="optInfluence">
            <option value="5">Малий</option>
            <option value="7" selected>Стандартний</option>
            <option value="10">Великий</option>
        </select>
        <label>Коефіцієнт складності боїв</label>
        <select id="optDifficulty">
            <option value="0.85">Легко (Бонуси ЗСУ)</option>
            <option value="1.0" selected>Реалістично (Баланс)</option>
            <option value="1.25">Хардкор (Перевага ворога)</option>
        </select>
        <label>Лінія фронту</label>
        <select id="optFrontline">
            <option value="1" selected>Відображати</option>
            <option value="0">Приховати</option>
        </select>
        <div class="modal-actions">
            <button class="btn btn-grey" onclick="closeSettings()">Закрити</button>
            <button class="btn btn-blue" onclick="applySettings()">Зберегти</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let mode = 'move';
    let selectedUnit = null;
    let influenceExtra = 7;
    let difficulty = 1.0;
    let showFrontline = true;

    // Спутникова мапа високої чіткості + підписи
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.55, 37.5], 7.8);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }).addTo(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, opacity: 0.65 }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const redNames = new Set([
        "Євпаторійський район","Бахчисарайський район","Джанкойський район","Керченський район",
        "Сімферопольський район","Феодосійський район","Ялтинський район","Білогірський район",
        "Красногвардійський район","Красноперекопський район","Ленінський район","Нижньогірський район",
        "Первомайський район","Роздольненський район","Сакський район","Совєтський район","Чорноморський район",
        "Алчевський район","Довжанський район","Луганський район","Ровеньківський район",
        "Сватівський район","Сєвєродонецький район","Старобільський район","Щастинський район",
        "Горлівський район","Донецький район","Кальміуський район","Маріупольський район",
        "Волноваський район","Покровський район","Бердянський район","Мелітопольський район",
        "Пологівський район","Василівський район","Генічеський район","Каховський район",
        "Скадовський район","Херсонський район"
    ]);
    const greyNames = new Set([
        "Бахмутський район","Краматорський район","Лиманський район","Ізюмський район",
        "Куп'янський район","Богодухівський район","Чугуївський район","Синельниківський район",
        "Нікопольський район","Бериславський район","Запорізький район"
    ]);

    function getRayonStatus(name, layer) {
        if (redNames.has(name)) {
            if (name === "Первомайський район") {
                let lat = 48.0;
                try { lat = layer.getBounds().getCenter().lat; } catch(e) {}
                return lat < 46.5 ? 'red' : 'green';
            }
            return 'red';
        }
        if (greyNames.has(name)) return 'grey';
        try {
            const centerLat = layer.getBounds().getCenter().lat;
            if (centerLat < 46.2) return 'red';
        } catch(e) {}
        return 'green';
    }

    function raionStyle(status) {
        if (status === 'red') return { color:'#7f1d1d', weight:1.5, fillColor:'#7f1d1d', fillOpacity:0.04 };
        if (status === 'grey') return { color:'#334155', weight:1.5, fillColor:'#334155', fillOpacity:0.04 };
        return { color:'#14532d', weight:1.5, fillColor:'#166534', fillOpacity:0.04 };
    }

    fetch('https://raw.githubusercontent.com/slawomirmatuszak/ukrainian_geodata/master/rayony.geojson')
        .then(r => r.json())
        .then(geo => {
            geo.features.forEach(f => {
                const props = f.properties || {};
                const name = props.rayon || props.name || props.shapeName || "Невідомий район";
                const tempLayer = L.geoJSON(f);
                const status = getRayonStatus(name, tempLayer);
                
                L.geoJSON(f, {
                    style: raionStyle(status),
                    onEachFeature: (feature, layer) => {
                        layer.on('click', (e) => {
                            L.DomEvent.stopPropagation(e);
                            layer.bindPopup(`<h3>Адмін-район: ${name}</h3><p>Статус контролю: <b>${statusText(status)}</b></p>`).openPopup();
                        });
                    }
                }).addTo(map);
            });
        });

    const frontCoords = [
        [49.80, 37.90],[49.55, 37.75],[49.30, 37.60],[49.05, 37.70],
        [48.85, 37.85],[48.70, 37.95],[48.55, 37.98],[48.40, 37.90],
        [48.25, 37.78],[48.10, 37.65],[47.95, 37.40],[47.80, 37.15],
        [47.65, 36.80],[47.52, 36.40],[47.42, 36.00],[47.35, 35.70]
    ];

    let frontLine = L.polyline(frontCoords, { color: '#f87171', weight: 4, opacity: 0.9, dashArray: '10 8' }).addTo(map);
    let frontZone = L.polyline(frontCoords, { color: '#ef4444', weight: 18, opacity: 0.15, lineCap: 'round' }).addTo(map);

    // НОВІ ПОДРОБИЦІ ДЛЯ МІСТ (З ОПИСОМ ТА ІНФОРМАЦІЄЮ)
    const cities = [
        { id:'bakhmut', name:"Бахмут", lat:48.595, lng:38.000, status:'red', radius:5.0, desc:"Ключовий транспортний вузол Східного фронту." },
        { id:'chasivyar', name:"Часів Яр", lat:48.588, lng:37.836, status:'grey', radius:3.9, desc:"Панівні висоти, потужний укріпрайон." },
        { id:'toretsk', name:"Торецьк", lat:48.392, lng:37.848, status:'grey', radius:4.2, desc:"Сектор інтенсивних міських боїв." },
        { id:'newyork', name:"Нью-Йорк", lat:48.332, lng:37.836, status:'red', radius:3.3, desc:"Селище міського типу з розвиненою промисловою зоною." },
        { id:'avdiivka', name:"Авдіївка", lat:48.140, lng:37.742, status:'red', radius:3.7, desc:"Історичний плацдарм на Донецькому напрямку." },
        { id:'kramatorsk', name:"Краматорськ", lat:48.723, lng:37.556, status:'green', radius:5.0, desc:"Адміністративний центр, штабне командування." },
        { id:'sloviansk', name:"Слов'янськ", lat:48.848, lng:37.606, status:'green', radius:4.6, desc:"Важливий логістичний та оборонний вузол." },
        { id:'kostiantynivka', name:"Костянтинівка", lat:48.522, lng:37.706, status:'green', radius:4.1, desc:"Прифронтове місто, ключова комунікація." },
        { id:'druzhkivka', name:"Дружківка", lat:48.621, lng:37.528, status:'green', radius:3.5, desc:"Стійкий тиловий гарнізонний пункт." },
        { id:'lyman', name:"Лиман", lat:48.988, lng:37.811, status:'green', radius:4.1, desc:"Лісовий залізничний вузол." },
        { id:'izium', name:"Ізюм", lat:49.212, lng:37.257, status:'green', radius:4.6, desc:"Плацдарм на річці Сіверський Донець." },
        { id:'kupyansk', name:"Куп'янськ", lat:49.710, lng:37.597, status:'grey', radius:4.4, desc:"Прикордонний рубіж активних зіткнень." },
        { id:'pokrovsk', name:"Покровськ", lat:48.282, lng:37.176, status:'green', radius:4.6, desc:"Важлива логістична артерія та транспортний хаб." },
        { id:'myrnohrad', name:"Мирноград", lat:48.305, lng:37.261, status:'green', radius:3.5, desc:"Шахтарське місто у прифронтовій зоні." },
        { id:'selidove', name:"Селидове", lat:48.147, lng:37.304, status:'grey', radius:3.5, desc:"Зона маневреної оборони." },
        { id:'ukrainsk', name:"Українськ", lat:48.100, lng:37.370, status:'grey', radius:3.0, desc:"Невеликий населений пункт на лінії зіткнення." },
        { id:'orikhiv', name:"Оріхів", lat:47.697, lng:35.785, status:'green', radius:4.1, desc:"Південний опорний пункт оборони." },
        { id:'huliaipole', name:"Гуляйполе", lat:47.664, lng:36.263, status:'grey', radius:3.7, desc:"Козацький край, стабільні позиційні бої." },
        { id:'robotyne', name:"Роботине", lat:47.449, lng:35.859, status:'grey', radius:3.0, desc:"Звільнений плацдарм на Запорізькому напрямку." },
        { id:'verbove', name:"Вербове", lat:47.430, lng:35.950, status:'red', radius:2.8, desc:"Ворожі укріплені позиції." },
        { id:'vuhledar', name:"Вугледар", lat:47.778, lng:37.238, status:'red', radius:3.7, desc:"Висотний укріплений пункт." },
        { id:'velykanovoselivka', name:"Велика Новосілка", lat:47.841, lng:36.831, status:'green', radius:3.7, desc:"Західний рубіж Донецької області." }
    ];

    const cityLayers = {};

    function cityStyle(s) {
        if (s === 'green') return { color:'#14532d', fillColor:'transparent', fillOpacity:0, weight:2.5 };
        if (s === 'grey')  return { color:'#334155', fillColor:'transparent', fillOpacity:0, weight:2.5 };
        return { color:'#7f1d1d', fillColor:'transparent', fillOpacity:0, weight:2.5 };
    }
    function influenceStyle(s) {
        if (s === 'green') return { color:'#166534', fillColor:'#166534', fillOpacity:0.08, weight:0 };
        if (s === 'grey')  return { color:'#334155', fillColor:'#334155', fillOpacity:0.06, weight:0 };
        return { color:'#7f1d1d', fillColor:'#7f1d1d', fillOpacity:0.08, weight:0 };
    }
    function statusText(s) {
        return s === 'green' ? 'Під контролем ЗСУ' : s === 'grey' ? 'Сіра зона / Бої' : 'Тимчасово окуповано';
    }

    function rebuildCities() {
        Object.values(cityLayers).forEach(c => {
            map.removeLayer(c.circle);
            map.removeLayer(c.influence);
        });

        cities.forEach(c => {
            const influence = L.circle([c.lat, c.lng], {
                radius: (c.radius + influenceExtra) * 1000,
                ...influenceStyle(c.status),
                interactive: false
            }).addTo(map);

            const circle = L.circle([c.lat, c.lng], {
                radius: c.radius * 1000,
                ...cityStyle(c.status),
                interactive: true
            }).addTo(map);

            circle.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                showCityPopup(c, circle);
            });

            cityLayers[c.id] = { ...c, circle, influence };
        });
        updatePower();
    }

    // ПОКРАЩЕНИЙ ПОП-АП МІСТА З ОПИСОМ ТА КНОПКОЮ АТАКИ
    function showCityPopup(c, layer) {
        layer.bindPopup(`
            <h3>📍 ${c.name}</h3>
            <p>Статус: <b>${statusText(c.status)}</b></p>
            <p style="opacity: 0.85; margin-top: 4px;"><i>${c.desc}</i></p>
            ${selectedUnit && selectedUnit.side === 'friendly' && c.status !== 'green' ? `
                <button class="pbtn pbtn-attack" onclick="attackCity('${c.id}')">⚔️ Штурмувати та звільнити</button>
            ` : ''}
        `).openPopup();
    }

    function setCityStatus(id, status) {
        const c = cityLayers[id];
        if (!c) return;
        c.status = status;
        const orig = cities.find(x => x.id === id);
        if (orig) orig.status = status;
        c.circle.setStyle(cityStyle(status));
        c.influence.setStyle(influenceStyle(status));
        updatePower();
    }

    rebuildCities();

    // НОВА СИСТЕМА ПІДРОЗДІЛІВ (З НОВИМИ НАЗВАМИ ТА ХАРАКТЕРИСТИКАМИ)
    const units = [];

    function makeIcon(color, strength, entrenched) {
        const size = 16 + Math.min(strength / 10, 8);
        const border = entrenched ? '3px solid #fbbf24' : '2px solid #fff';
        return L.divIcon({
            html: `<div style="background:${color};width:${size}px;height:${size}px;border-radius:50%;border:${border};box-shadow:0 0 10px ${color}; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:bold; color:#fff;"></div>`,
            iconSize: [size, size], className: ''
        });
    }

    function findNearestCity(lat, lng) {
        let best = null, bestD = Infinity;
        for (const id in cityLayers) {
            const c = cityLayers[id];
            const d = map.distance([lat, lng], [c.lat, c.lng]);
            if (d < bestD) { bestD = d; best = c; }
        }
        return best;
    }

    function createUnit(data) {
        const start = findNearestCity(data.lat, data.lng);
        const marker = L.marker([start.lat, start.lng], {
            icon: makeIcon(data.color, data.strength, false),
            draggable: true
        }).addTo(map);

        const unit = { ...data, lat: start.lat, lng: start.lng, marker, entrenched: false, currentCity: start.id };

        marker.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            selectedUnit = unit;
            marker.bindPopup(`
                <h3>🛡️ ${unit.name}</h3>
                <p>Тип: <b>${unit.type}</b></p>
                <p>⚔️ Атака: <b>${unit.attack}</b> | 🛡️ Захист: <b>${unit.defense}</b></p>
                <p>Живучість: <b>${Math.round(unit.strength)}</b> · Мораль: <b>${Math.round(unit.org)}%</b></p>
                <p>${unit.entrenched ? '🛡️ В окопах (Бонус захисту)' : 'Готовий до маневру'}</p>
                ${unit.side === 'friendly' ? `
                    <button class="pbtn pbtn-entrench" onclick="toggleEntrench('${unit.id}')">
                        ${unit.entrenched ? 'Зняти з укріплень' : '🛡️ Окопатися / Закріпитись'}
                    </button>
                ` : ''}
            `).openPopup();
        });

        marker.on('dragend', e => {
            const pos = e.target.getLatLng();
            const target = findNearestCity(pos.lat, pos.lng);

            const cost = unit.entrenched ? 10 : 4;
            if (unit.org < cost + 5) {
                alert('Низька мораль/організація підрозділу для перекидання!');
                marker.setLatLng([unit.lat, unit.lng]);
                return;
            }

            unit.org = Math.max(10, unit.org - cost);
            unit.entrenched = false;
            unit.lat = target.lat;
            unit.lng = target.lng;
            unit.currentCity = target.id;
            marker.setLatLng([target.lat, target.lng]);
            marker.setIcon(makeIcon(unit.color, unit.strength, false));

            if (target) {
                const desired = unit.side === 'friendly' ? 'green' : 'red';
                if (target.status !== desired) {
                    setCityStatus(target.id, target.status !== 'grey' ? 'grey' : desired);
                }
            }
            updatePower();
        });

        units.push(unit);
        return unit;
    }

    window.toggleEntrench = function(id) {
        const u = units.find(x => x.id === id);
        if (!u) return;
        u.entrenched = !u.entrenched;
        u.marker.setIcon(makeIcon(u.color, u.strength, u.entrenched));
        if (u.entrenched && u.currentCity && u.side === 'friendly') {
            setCityStatus(u.currentCity, 'green');
            u.org = Math.min(100, u.org + 8);
        }
        u.marker.closePopup();
        updatePower();
    };

    // НОВА СИСТЕМА БОЮ З УРАХУВАННЯМ АТАКИ ТА ЗАХИСТУ
    window.attackCity = function(cityId) {
        if (!selectedUnit || selectedUnit.side !== 'friendly') {
            alert('Оберіть свій бойовий підрозділ!');
            return;
        }
        const city = cityLayers[cityId];
        if (!city || city.status === 'green') return;

        const dist = map.distance([selectedUnit.lat, selectedUnit.lng], [city.lat, city.lng]) / 1000;
        if (dist > 25) {
            alert('Ціль занадто далеко для удару.');
            return;
        }

        // Формула розрахунку бойової сили
        let combatPower = (selectedUnit.attack * 1.2 + selectedUnit.strength * 0.5) * (selectedUnit.org / 100);
        if (selectedUnit.entrenched) combatPower *= 1.1;
        combatPower /= difficulty;

        const roll = Math.random();
        if (roll < 0.50 + (combatPower / 200)) {
            setCityStatus(cityId, 'green');
            selectedUnit.org = Math.min(100, selectedUnit.org + 6);
            alert(`✅ Успіх! ${selectedUnit.name} звільнив місто ${city.name}!`);
        } else if (roll < 0.78) {
            setCityStatus(cityId, 'grey');
            selectedUnit.strength = Math.max(20, selectedUnit.strength - 7);
            selectedUnit.org = Math.max(25, selectedUnit.org - 10);
            alert(`⚠️ Запеклі бої за ${city.name}. Ворог відкинутий у сіру зону, є втрати.`);
        } else {
            selectedUnit.strength = Math.max(15, selectedUnit.strength - 14);
            selectedUnit.org = Math.max(20, selectedUnit.org - 15);
            alert(`❌ Штурм ${city.name} захлинувся. Ворог утримав позиції, підрозділ понесе втрати.`);
        }
        selectedUnit.marker.setIcon(makeIcon(selectedUnit.color, selectedUnit.strength, selectedUnit.entrenched));
        updatePower();
    };

    function setMode(m) {
        mode = m;
        document.getElementById('btnMove').classList.toggle('active', m === 'move');
    }
    setMode('move');

    function endTurn() {
        units.forEach(u => {
            if (u.side === 'friendly') u.org = Math.min(100, u.org + 6);
        });
        // Штучний інтелект ворога тисне на прифронтові міста
        units.filter(u => u.side === 'enemy').forEach(u => {
            const near = findNearestCity(u.lat, u.lng);
            if (near && near.status === 'green' && Math.random() < 0.3) {
                setCityStatus(near.id, 'grey');
            }
        });
        updatePower();
        alert('⏭ Хід завершено. Проведено ротацію, бойовий дух підрозділів частково відновлено.');
    }

    function openSettings() { document.getElementById('settingsModal').classList.add('open'); }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
    function applySettings() {
        influenceExtra = parseInt(document.getElementById('optInfluence').value);
        difficulty = parseFloat(document.getElementById('optDifficulty').value);
        showFrontline = document.getElementById('optFrontline').value === '1';

        if (showFrontline) { frontLine.addTo(map); frontZone.addTo(map); }
        else { map.removeLayer(frontLine); map.removeLayer(frontZone); }
        rebuildCities();
        closeSettings();
    }

    // СТВОРЕННЯ НОВИХ ПІДРОЗДІЛІВ З НОВИМИ СТАТАМИ
    createUnit({ id:'f1', name:"1-й окремий штурмовий 'Вовкодав'", side:'friendly', type:'Штурмова піхота', lat:48.70, lng:37.60, strength:95, org:90, attack:85, defense:75, color:'#38bdf8' });
    createUnit({ id:'f2', name:"Бригада спеціального призначення 'Хартія'", side:'friendly', type:'Мобільна гвардія', lat:48.50, lng:37.45, strength:90, org:92, attack:88, defense:80, color:'#22c55e' });
    createUnit({ id:'f3', name:"92-га ОМБр ім. кошового отамана Сірка", side:'friendly', type:'Механізована', lat:48.95, lng:37.20, strength:100, org:85, attack:82, defense:85, color:'#a78bfa' });
    createUnit({ id:'f4', name:"Російський Добровольчий Корпус (РДК)", side:'friendly', type:'Добровольчий рейдовий', lat:47.55, lng:36.10, strength:80, org:95, attack:90, defense:65, color:'#eab308' });

    createUnit({ id:'e1', name:"76-а десантно-штурмова дивізія РФ", side:'enemy', type:'Елітне ДШВ', lat:48.35, lng:37.95, strength:98, org:80, attack:86, defense:78, color:'#ef4444' });
    createUnit({ id:'e2', name:"155-та бригада морської піхоти РФ", side:'enemy', type:'Морська піхота', lat:47.40, lng:36.60, strength:88, org:72, attack:80, defense:70, color:'#f97316' });
    createUnit({ id:'e3', name:"Гвардійська танкова армія РФ", side:'enemy', type:'Бронетанковий кулак', lat:48.85, lng:38.20, strength:110, org:75, attack:92, defense:88, color:'#dc2626' });

    function updatePower() {
        let f = 0, e = 0, g = 0;
        units.forEach(u => {
            if (u.side === 'friendly') f += u.strength;
            else e += u.strength;
        });
        Object.values(cityLayers).forEach(c => { if (c.status === 'green') g++; });
        document.getElementById('friendlyPower').textContent = Math.round(f);
        document.getElementById('enemyPower').textContent = Math.round(e);
        document.getElementById('citiesGreen').textContent = g;
    }
    updatePower();

    setInterval(() => {
        const n = new Date();
        document.getElementById('gameTime').textContent =
            String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
    }, 1000);
</script>
