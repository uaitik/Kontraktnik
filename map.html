<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мультиплеєр Симуляція ЛБЗ - Україна 2023</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #05080c;
            color: #c9d1d9;
        }
        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #05080c;
        }
        #canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 500;
        }
        .ui-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1000;
            background: rgba(10, 14, 20, 0.92);
            border: 1px solid rgba(56, 68, 77, 0.8);
            border-radius: 8px;
            padding: 16px;
            width: 330px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
        }
        .ui-panel h2 {
            font-size: 15px;
            color: #58a6ff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ui-panel p {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 12px;
            line-height: 1.45;
        }
        .status-tracker {
            background: rgba(4, 7, 12, 0.7);
            border-radius: 6px;
            padding: 10px;
            font-size: 12px;
            border: 1px solid rgba(48, 54, 61, 0.5);
            margin-bottom: 10px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .status-row:last-child {
            margin-bottom: 0;
        }
        .val-blue { color: #58a6ff; font-weight: 600; }
        .val-red { color: #ff7b72; font-weight: 600; }
        .val-date { color: #3fb950; font-weight: 600; }

        .speed-controls {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }
        .speed-btn {
            flex: 1;
            padding: 7px 4px;
            background: #161b22;
            border: 1px solid #30363d;
            color: #8b949e;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .speed-btn:hover {
            border-color: #58a6ff;
            color: #c9d1d9;
        }
        .speed-btn.active {
            background: rgba(88, 166, 255, 0.18);
            border-color: #58a6ff;
            color: #58a6ff;
            box-shadow: 0 0 8px rgba(88, 166, 255, 0.25);
        }
        .speed-btn.paused-active {
            background: rgba(210, 153, 34, 0.2);
            border-color: #d29922;
            color: #d29922;
        }

        .control-btn {
            width: 100%;
            padding: 8px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .control-btn:hover {
            background: #30363d;
            border-color: #58a6ff;
        }

        .unit-marker {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }
        .unit-marker:active {
            cursor: grabbing;
        }
        .unit-card {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.8);
            border: 2px solid #ffffff;
            transition: transform 0.15s ease, background 0.3s;
        }
        .unit-card:hover {
            transform: scale(1.12);
        }
        .unit-blue {
            background: linear-gradient(135deg, #0d59c8, #418bee);
            color: #ffffff;
        }
        .unit-red {
            background: linear-gradient(135deg, #c92a2a, #ff6b6b);
            color: #ffffff;
        }
        .unit-retreated {
            filter: grayscale(0.8);
            opacity: 0.5;
        }
        .unit-label {
            background: rgba(10, 14, 20, 0.9);
            color: #f0f6fc;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 3px;
            margin-top: 3px;
            white-space: nowrap;
            border: 1px solid rgba(240, 246, 252, 0.15);
        }
        .hp-bar-bg {
            width: 40px;
            height: 5px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 3px;
            margin-top: 2px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .hp-bar-fill {
            height: 100%;
            background: #3fb950;
            width: 100%;
            transition: width 0.15s linear, background-color 0.3s;
        }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="app-container">
    <div id="map"></div>
    <canvas id="canvas-overlay"></canvas>

    <div class="ui-panel">
        <h2>ЛБЗ: Мультиплеєр <span id="pulse-dot" style="height:8px;width:8px;background:#3fb950;border-radius:50%;display:inline-block;"></span></h2>
        <p>Мережева симуляція: переміщуйте підрозділи, захоплюйте територію. Зміни бачать усі підключені гравці!</p>
        <div class="status-tracker">
            <div class="status-row">
                <span>Дата симуляції:</span>
                <span class="val-date" id="sim-date">01.01.2023</span>
            </div>
            <div class="status-row">
                <span>Швидкість гри:</span>
                <span id="speed-label" style="color:#58a6ff; font-weight:600;">5x (Макс)</span>
            </div>
            <div class="status-row">
                <span>Гравців онлайн:</span>
                <span class="val-blue" id="online-players">1</span>
            </div>
            <div class="status-row">
                <span>Стан боїв:</span>
                <span id="combat-status" style="color:#d29922;">Спостереження</span>
            </div>
        </div>

        <!-- Кнопки швидкості: Пауза, 1x, 2x, 5x -->
        <div class="speed-controls">
            <button class="speed-btn" id="btn-speed-0" onclick="setGameSpeed(0)">⏸ Пауза</button>
            <button class="speed-btn" id="btn-speed-1" onclick="setGameSpeed(1)">1x</button>
            <button class="speed-btn" id="btn-speed-2" onclick="setGameSpeed(2)">2x</button>
            <button class="speed-btn active" id="btn-speed-5" onclick="setGameSpeed(5)">5x</button>
        </div>

        <button class="control-btn" id="toggle-ai-btn" onclick="toggleRedAI()">Переключити ШІ Ворога (Авто/Ручне)</button>
    </div>
</div>

<!-- Leaflet JS & Turf JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

<script>
    // Ініціалізація Firebase (використовуємо твою конфігурацію)
    const firebaseConfig = {
        apiKey: "AIzaSyCeWM1wdHdN6bIXFXTqHXO7WgJNJK53nwk",
        authDomain: "storinka-d7bd6.firebaseapp.com",
        databaseURL: "https://storinka-d7bd6-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "storinka-d7bd6",
        storageBucket: "storinka-d7bd6.appspot.com",
        messagingSenderId: "317173750408",
        appId: "1:317173750408:web:62d09563fc750e20589d3d",
        measurementId: "G-5HX3ES92NE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const gameRef = db.ref('multiplayer_lbz_session');

    // Облік гравців онлайн (Presence)
    const presenceRef = db.ref('multiplayer_presence');
    const myPresenceRef = presenceRef.push();
    database = db; // сумісність

    database.ref('.info/connected').on('value', (snapshot) => {
        if (snapshot.val() === true) {
            myPresenceRef.onDisconnect().remove();
            myPresenceRef.set({ timestamp: firebase.database.ServerValue.TIMESTAMP });
        }
    });

    presenceRef.on('value', (snapshot) => {
        let count = 0;
        snapshot.forEach(() => { count++; });
        document.getElementById('online-players').innerText = Math.max(1, count);
    });

    // 1. ІНІЦІАЛІЗАЦІЯ КАРТИ
    const map = L.map('map', {
        center: [48.5, 37.8],
        zoom: 7,
        minZoom: 6,
        maxZoom: 12,
        zoomControl: false
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 18
    }).addTo(map);

    // 2. ОПОРНІ ТОЧКИ ЛІНІЇ ФРОНТУ
    let currentFrontlinePoints = [
        [47.35, 35.15],
        [47.48, 35.80],
        [47.65, 36.25],
        [47.77, 36.85],
        [47.98, 37.50],
        [48.13, 37.75],
        [48.60, 38.00],
        [48.95, 38.10],
        [49.40, 38.00],
        [49.70, 37.60],
        [49.95, 37.70],
        [50.25, 36.90],
        [50.45, 36.60]
    ];

    map.createPane('controlZonesPane');
    map.getPane('controlZonesPane').style.zIndex = 350;

    let redZoneLayer = L.polygon([], {
        color: 'transparent',
        fillColor: '#da3633',
        fillOpacity: 0.28,
        pane: 'controlZonesPane'
    }).addTo(map);

    let blueZoneLayer = L.polygon([], {
        color: 'transparent',
        fillColor: '#1f6beb',
        fillOpacity: 0.24,
        pane: 'controlZonesPane'
    }).addTo(map);

    let frontlinePolyline = L.polyline([], {
        color: '#ff4d4d',
        weight: 4,
        dashArray: '8, 6',
        lineCap: 'round'
    }).addTo(map);

    // 3. ПІДРОЗДІЛИ
    let isRedAIEnabled = false;
    let gameSpeed = 5;
    let simDate = new Date(2023, 0, 1);
    let dateAccumulator = 0;
    let lastFrameTime = performance.now();
    let localDraggingId = null;

    let units = [
        { id: 'b1', name: '47 ОМБр', side: 'blue', lat: 47.38, lng: 35.45, power: 100, hp: 100, range: 0.85, status: 'active' },
        { id: 'b2', name: '3 ОШБр', side: 'blue', lat: 48.50, lng: 37.50, power: 100, hp: 100, range: 0.80, status: 'active' },
        { id: 'b3', name: '80 ДШБр', side: 'blue', lat: 49.30, lng: 37.40, power: 95, hp: 100, range: 0.80, status: 'active' },
        { id: 'b4', name: '72 ОМБр', side: 'blue', lat: 47.70, lng: 36.40, power: 95, hp: 100, range: 0.80, status: 'active' },
        { id: 'b5', name: '92 ОШБр', side: 'blue', lat: 50.10, lng: 36.40, power: 95, hp: 100, range: 0.85, status: 'active' },

        { id: 'r1', name: '58 ЗВА', side: 'red', lat: 47.60, lng: 36.45, power: 90, hp: 100, range: 0.70, status: 'active' },
        { id: 'r2', name: '1 АК', side: 'red', lat: 48.10, lng: 38.10, power: 90, hp: 100, range: 0.70, status: 'active' },
        { id: 'r3', name: '2 АК', side: 'red', lat: 48.80, lng: 38.45, power: 90, hp: 100, range: 0.70, status: 'active' },
        { id: 'r4', name: '1 ТА', side: 'red', lat: 49.70, lng: 38.40, power: 90, hp: 100, range: 0.70, status: 'active' }
    ];

    let unitMarkers = {};

    // Ініціалізація або завантаження з Firebase
    gameRef.child('units').once('value', (snapshot) => {
        if (!snapshot.exists()) {
            let initObj = {};
            units.forEach(u => { initObj[u.id] = { lat: u.lat, lng: u.lng, hp: u.hp, status: u.status }; });
            gameRef.child('units').set(initObj);
        }
    });

    // Слухаємо реальний час від інших гравців
    gameRef.child('units').on('value', (snapshot) => {
        if (!snapshot.exists()) return;
        const remoteUnits = snapshot.val();
        units.forEach(u => {
            if (remoteUnits[u.id]) {
                const ru = remoteUnits[u.id];
                u.hp = ru.hp;
                u.status = ru.status;
                updateHpBar(u);

                const card = document.getElementById(`card-${u.id}`);
                if (card) {
                    if (u.status === 'retreated') card.classList.add('unit-retreated');
                    else card.classList.remove('unit-retreated');
                }

                // Оновлюємо позицію, якщо не тягнемо самі в цей момент
                if (localDraggingId !== u.id) {
                    if (Math.abs(u.lat - ru.lat) > 0.0005 || Math.abs(u.lng - ru.lng) > 0.0005) {
                        u.lat = ru.lat;
                        u.lng = ru.lng;
                        if (unitMarkers[u.id]) {
                            unitMarkers[u.id].setLatLng([u.lat, u.lng]);
                        }
                    }
                }
            }
        });
        updateFrontlineTerritory(0.05);
    });

    function createUnitMarkers() {
        units.forEach(u => {
            const isBlue = u.side === 'blue';
            const iconHtml = `
                <div class="unit-marker" id="marker-cont-${u.id}">
                    <div class="unit-card ${isBlue ? 'unit-blue' : 'unit-red'}" id="card-${u.id}">
                        ${isBlue ? 'ЗСУ' : 'ВС'}
                    </div>
                    <div class="unit-label">${u.name}</div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-${u.id}" style="width: ${u.hp}%"></div></div>
                </div>
            `;

            const customIcon = L.divIcon({
                html: iconHtml,
                className: '',
                iconSize: [46, 58],
                iconAnchor: [23, 29]
            });

            const marker = L.marker([u.lat, u.lng], {
                icon: customIcon,
                draggable: true
            }).addTo(map);

            marker.on('dragstart', function() {
                localDraggingId = u.id;
            });

            marker.on('drag', function(e) {
                if (u.status === 'retreated') return;
                const newLatLng = e.target.getLatLng();
                u.lat = newLatLng.lat;
                u.lng = newLatLng.lng;
                updateFrontlineTerritory(0.35);

                gameRef.child('units/' + u.id).update({
                    lat: u.lat,
                    lng: u.lng,
                    hp: u.hp,
                    status: u.status
                });
            });

            marker.on('dragend', function() {
                localDraggingId = null;
                updateFrontlineTerritory(0.5);
                gameRef.child('units/' + u.id).update({
                    lat: u.lat,
                    lng: u.lng,
                    hp: u.hp,
                    status: u.status
                });
            });

            unitMarkers[u.id] = marker;
        });
    }

    function toggleRedAI() {
        isRedAIEnabled = !isRedAIEnabled;
        const textEl = document.getElementById('control-mode-text');
        if (textEl) {
            textEl.innerText = isRedAIEnabled ? 'Авто' : 'Ручний';
            textEl.style.color = isRedAIEnabled ? '#ff7b72' : '#58a6ff';
        }
    }

    function setGameSpeed(speed) {
        gameSpeed = speed;
        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.classList.remove('active', 'paused-active');
        });

        const activeBtn = document.getElementById(`btn-speed-${speed}`);
        const pulseDot = document.getElementById('pulse-dot');
        const speedLabel = document.getElementById('speed-label');
        const combatStatusEl = document.getElementById('combat-status');

        if (speed === 0) {
            activeBtn.classList.add('paused-active');
            pulseDot.style.background = '#d29922';
            speedLabel.innerText = 'Пауза';
            speedLabel.style.color = '#d29922';
            combatStatusEl.innerText = 'Пауза';
            combatStatusEl.style.color = '#d29922';
        } else {
            activeBtn.classList.add('active');
            pulseDot.style.background = '#3fb950';
            speedLabel.style.color = '#58a6ff';
            if (speed === 1) speedLabel.innerText = '1x (Повільно)';
            if (speed === 2) speedLabel.innerText = '2x (Середньо)';
            if (speed === 5) speedLabel.innerText = '5x (Макс)';
        }
    }

    // 4. ОРГАНІЧНІ КРИВОЛІНІЙНІ ЗОНИ ТА ПРОСУВАННЯ ЛБЗ
    function updateFrontlineTerritory(captureRate = 0.04) {
        const activeBlues = units.filter(u => u.side === 'blue' && u.status === 'active');
        const activeReds = units.filter(u => u.side === 'red' && u.status === 'active');

        for (let i = 0; i < currentFrontlinePoints.length; i++) {
            let ptLat = currentFrontlinePoints[i][0];
            let ptLng = currentFrontlinePoints[i][1];

            activeBlues.forEach(b => {
                let latDiff = Math.abs(ptLat - b.lat);
                if (latDiff < 0.85 && b.lng > ptLng - 0.12) {
                    let isBlockedByRed = activeReds.some(r => Math.hypot(r.lat - b.lat, r.lng - b.lng) < 0.45 && r.hp > 25);
                    if (!isBlockedByRed) {
                        let influence = Math.exp(-latDiff * 1.8);
                        let targetLng = b.lng + 0.14;
                        if (targetLng > ptLng) {
                            ptLng += (targetLng - ptLng) * captureRate * influence;
                        }
                    }
                }
            });

            activeReds.forEach(r => {
                let latDiff = Math.abs(ptLat - r.lat);
                if (latDiff < 0.85 && r.lng < ptLng + 0.12) {
                    let isBlockedByBlue = activeBlues.some(b => Math.hypot(b.lat - r.lat, b.lng - r.lng) < 0.45 && b.hp > 25);
                    if (!isBlockedByBlue) {
                        let influence = Math.exp(-latDiff * 1.8);
                        let targetLng = r.lng - 0.14;
                        if (targetLng < ptLng) {
                            ptLng += (targetLng - ptLng) * captureRate * influence;
                        }
                    }
                }
            });

            currentFrontlinePoints[i][1] = ptLng;
        }

        let smoothedCoords = [];
        for (let i = 0; i < currentFrontlinePoints.length; i++) {
            let prevLng = (currentFrontlinePoints[i - 1] || currentFrontlinePoints[i])[1];
            let currLng = currentFrontlinePoints[i][1];
            let nextLng = (currentFrontlinePoints[i + 1] || currentFrontlinePoints[i])[1];

            let elasticLng = (prevLng + currLng * 2 + nextLng) / 4;
            currentFrontlinePoints[i][1] = currLng * 0.85 + elasticLng * 0.15;
            smoothedCoords.push([currentFrontlinePoints[i][0], currentFrontlinePoints[i][1]]);
        }

        renderSmoothedFrontline(smoothedCoords);
    }

    function renderSmoothedFrontline(points) {
        let geojsonCoords = points.map(p => [p[1], p[0]]);
        let lineFeature = turf.lineString(geojsonCoords);

        let smoothed = turf.bezierSpline(lineFeature, {
            resolution: 12000,
            sharpness: 0.88
        });

        let leafletCoords = smoothed.geometry.coordinates.map(c => [c[1], c[0]]);
        frontlinePolyline.setLatLngs(leafletCoords);

        // Органічні криволінійні зони, що повторюють вигин фронту замість прямих гігантських трикутників
        let redSideCoords = leafletCoords.map(pt => [pt[0], pt[1] + 3.2]);
        let blueSideCoords = leafletCoords.slice().reverse().map(pt => [pt[0], pt[1] - 3.2]);

        redZoneLayer.setLatLngs([...leafletCoords, ...redSideCoords]);
        blueZoneLayer.setLatLngs([...leafletCoords.slice().reverse(), ...blueSideCoords]);
    }

    // 5. ДИНАМІКА БОЇВ ТА CANVAS
    const canvas = document.getElementById('canvas-overlay');
    const ctx = canvas.getContext('2d');
    let projectiles = [];
    let explosions = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function updateHpBar(unit) {
        const bar = document.getElementById(`hp-${unit.id}`);
        if (bar) {
            bar.style.width = `${Math.max(0, unit.hp)}%`;
            if (unit.hp < 30) {
                bar.style.backgroundColor = '#ff4d4d';
            } else if (unit.hp < 60) {
                bar.style.backgroundColor = '#d29922';
            } else {
                bar.style.backgroundColor = '#3fb950';
            }
        }
    }

    function handleRetreat(unit) {
        if (unit.status === 'retreated') return;
        unit.status = 'retreated';

        const card = document.getElementById(`card-${unit.id}`);
        if (card) card.classList.add('unit-retreated');

        const retreatDist = 0.25;
        if (unit.side === 'blue') {
            unit.lng -= retreatDist;
        } else {
            unit.lng += retreatDist;
        }

        if (unitMarkers[unit.id]) {
            unitMarkers[unit.id].setLatLng([unit.lat, unit.lng]);
        }

        let recoverInterval = setInterval(() => {
            if (gameSpeed === 0) return;
            const speedMult = gameSpeed / 5;
            unit.hp += 20 * speedMult;
            if (unit.hp >= 100) {
                unit.hp = 100;
                unit.status = 'active';
                if (card) card.classList.remove('unit-retreated');
                clearInterval(recoverInterval);
                updateFrontlineTerritory(0.2);
            }
            updateHpBar(unit);
            
            if (localDraggingId === null) {
                gameRef.child('units/' + unit.id).update({ hp: unit.hp, status: unit.status, lng: unit.lng });
            }
        }, 1000);
    }

    function triggerFirefight(uBlue, uRed, speedMult) {
        if (uBlue.status !== 'active' || uRed.status !== 'active') return;

        let p1 = map.latLngToContainerPoint([uBlue.lat, uBlue.lng]);
        let p2 = map.latLngToContainerPoint([uRed.lat, uRed.lng]);

        if (Math.random() < 0.6 * speedMult) {
            projectiles.push({
                x: p1.x, y: p1.y, targetX: p2.x, targetY: p2.y, progress: 0,
                speed: (0.045 + Math.random() * 0.03) * Math.max(0.4, speedMult), color: '#58a6ff'
            });
        }
        if (Math.random() < 0.5 * speedMult) {
            projectiles.push({
                x: p2.x, y: p2.y, targetX: p1.x, targetY: p1.y, progress: 0,
                speed: (0.045 + Math.random() * 0.03) * Math.max(0.4, speedMult), color: '#ff7b72'
            });
        }

        if (Math.random() < 0.25 * speedMult) {
            uRed.hp -= 3.5;
            uBlue.hp -= 2.0;

            updateHpBar(uRed);
            updateHpBar(uBlue);

            explosions.push({
                x: p2.x + (Math.random() - 0.5) * 20,
                y: p2.y + (Math.random() - 0.5) * 20,
                radius: 2, maxRadius: 12 + Math.random() * 6, alpha: 1
            });

            if (uRed.hp <= 15 && uRed.status === 'active') {
                handleRetreat(uRed);
            }
            if (uBlue.hp <= 15 && uBlue.status === 'active') {
                handleRetreat(uBlue);
            }
        }
    }

    function updateRedAI(speedMult) {
        if (!isRedAIEnabled || gameSpeed === 0) return;

        units.filter(u => u.side === 'red' && u.status === 'active').forEach(r => {
            let closestBlue = null;
            let minDist = 999;
            units.filter(b => b.side === 'blue' && b.status === 'active').forEach(b => {
                let d = Math.hypot(b.lat - r.lat, b.lng - r.lng);
                if (d < minDist) {
                    minDist = d;
                    closestBlue = b;
                }
            });

            if (closestBlue && minDist > 0.4 && minDist < 1.8) {
                r.lat += (closestBlue.lat - r.lat) * 0.004 * speedMult;
                r.lng += (closestBlue.lng - r.lng) * 0.004 * speedMult;
                if (unitMarkers[r.id]) {
                    unitMarkers[r.id].setLatLng([r.lat, r.lng]);
                }
            }
        });
    }

    function animateCombat(now) {
        const dt = (now - lastFrameTime) / 1000;
        lastFrameTime = now;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameSpeed > 0) {
            const speedMult = gameSpeed / 5;

            dateAccumulator += dt * speedMult;
            if (dateAccumulator >= 1.0) {
                const daysToAdd = Math.floor(dateAccumulator);
                dateAccumulator -= daysToAdd;
                simDate.setDate(simDate.getDate() + daysToAdd);

                const day = String(simDate.getDate()).padStart(2, '0');
                const month = String(simDate.getMonth() + 1).padStart(2, '0');
                const year = simDate.getFullYear();
                document.getElementById('sim-date').innerText = `${day}.${month}.${year}`;
            }

            updateFrontlineTerritory(0.05 * speedMult);

            let activeCombats = 0;
            let blueUnits = units.filter(u => u.side === 'blue' && u.status === 'active');
            let redUnits = units.filter(u => u.side === 'red' && u.status === 'active');

            blueUnits.forEach(b => {
                redUnits.forEach(r => {
                    let dist = Math.hypot(b.lat - r.lat, b.lng - r.lng);
                    if (dist < (b.range + r.range)) {
                        triggerFirefight(b, r, speedMult);
                        activeCombats++;
                    }
                });
            });

            updateRedAI(speedMult);

            const combatStatusEl = document.getElementById('combat-status');
            if (combatStatusEl) {
                if (activeCombats > 0) {
                    combatStatusEl.innerText = `Інтенсивний бій (${activeCombats})`;
                    combatStatusEl.style.color = '#ff7b72';
                } else {
                    combatStatusEl.innerText = 'Спостереження';
                    combatStatusEl.style.color = '#d29922';
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.progress += p.speed;

                let currentX = p.x + (p.targetX - p.x) * p.progress;
                let currentY = p.y + (p.targetY - p.y) * p.progress;

                ctx.beginPath();
                ctx.moveTo(p.x + (p.targetX - p.x) * Math.max(0, p.progress - 0.2), p.y + (p.targetY - p.y) * Math.max(0, p.progress - 0.2));
                ctx.lineTo(currentX, currentY);
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 2.5;
                ctx.stroke();

                if (p.progress >= 1) {
                    explosions.push({ x: p.targetX, y: p.targetY, radius: 2, maxRadius: 10, alpha: 1 });
                    projectiles.splice(i, 1);
                }
            }

            for (let i = explosions.length - 1; i >= 0; i--) {
                let ex = explosions[i];
                ex.radius += 0.8 * Math.max(0.4, speedMult);
                ex.alpha -= 0.06 * Math.max(0.4, speedMult);

                ctx.beginPath();
                ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 140, 0, ${Math.max(0, ex.alpha)})`;
                ctx.fill();

                if (ex.alpha <= 0) explosions.splice(i, 1);
            }
        }

        requestAnimationFrame(animateCombat);
    }

    map.on('move', function() {
        projectiles = [];
        explosions = [];
    });

    // Ініціалізація
    createUnitMarkers();
    updateFrontlineTerritory(0.5);
    requestAnimationFrame(animateCombat);

</script>
</body>
</html>
