<!DOCTYPE html>
<html lang="uk-UA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlan Division — Тактична Гра</title>
    <style>
        :root {
            --bg-dark: #0a0f1a;
            --bg-card: rgba(15, 23, 42, 0.88);
            --accent: #38bdf8;
            --text-main: #cbd5e1;
            --text-heading: #f8fafc;
            --accent-border: rgba(56, 189, 248, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        .game-wrapper { max-width: 800px; width: 100%; background: var(--bg-card); border: 1px solid var(--accent-border); border-radius: 16px; padding: 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.6); text-align: center; backdrop-filter: blur(12px); }
        
        h1 { color: var(--text-heading); font-size: 1.8rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px; }
        p { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.95rem; }

        /* Ігрове поле (тут буде твій геймплей) */
        #gameCanvas { background: #070b14; border: 2px solid var(--accent); border-radius: 10px; width: 100%; height: 400px; display: block; margin-bottom: 1.5rem; box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.2); }

        .btn-back { display: inline-block; background: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid var(--accent-border); padding: 0.8rem 1.8rem; border-radius: 8px; font-weight: 700; text-decoration: none; text-transform: uppercase; letter-spacing: 0.8px; transition: all 0.2s; }
        .btn-back:hover { background: var(--accent); color: var(--bg-dark); box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>Carlan Division: Tactical Zone</h1>
        <p>Сектор мапи активовано. Готуйся до виконання завдання.</p>
        
        <!-- Поле для гри (Canvas або інтерактивна зона) -->
        <canvas id="gameCanvas"></canvas>

        <a href="../index.html" class="btn-back">← Повернутися на головну базу</a>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Підлаштовуємо розміри кавуваса під реальний екран
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;

        // Простий тестовий малюнок на фоні гри (можна замінити своєю логікою)
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#38bdf8';
            ctx.font = '20px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText("Тут буде твоя гра чи інтерактивна мапа!", canvas.width / 2, canvas.height / 2);
        }
        draw();
    </script>
</body>
</html>
