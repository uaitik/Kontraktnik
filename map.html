<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляція Інтерактивної ЛБЗ — Україна 2023 (Мультиплеєр)</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #05080c;
            color: #c9d1d9;
        }
        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #05080c;
        }
        #canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 500;
        }
        .ui-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1000;
            background: rgba(10, 14, 20, 0.92);
            border: 1px solid rgba(56, 68, 77, 0.8);
            border-radius: 8px;
            padding: 16px;
            width: 335px;
            max-width: calc(100vw - 32px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
        }
        .ui-panel h2 {
            font-size: 15px;
            color: #58a6ff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ui-panel p {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 12px;
            line-height: 1.45;
        }
        .status-tracker {
            background: rgba(4, 7, 12, 0.7);
            border-radius: 6px;
            padding: 10px;
            font-size: 12px;
            border: 1px solid rgba(48, 54, 61, 0.5);
            margin-bottom: 10px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .status-row:last-child {
            margin-bottom: 0;
        }
        .val-blue { color: #58a6ff; font-weight: 600; }
        .val-red { color: #ff7b72; font-weight: 600; }
        .val-date { color: #3fb950; font-weight: 600; }

        .speed-controls {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }
        .speed-btn {
            flex: 1;
            padding: 7px 4px;
            background: #161b22;
            border: 1px solid #30363d;
            color: #8b949e;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .speed-btn:hover {
            border-color: #58a6ff;
            color: #c9d1d9;
        }
        .speed-btn.active {
            background: rgba(88, 166, 255, 0.18);
            border-color: #58a6ff;
            color: #58a6ff;
            box-shadow: 0 0 8px rgba(88, 166, 255, 0.25);
        }
        .speed-btn.paused-active {
            background: rgba(210, 153, 34, 0.2);
            border-color: #d29922;
            color: #d29922;
        }

        .action-row {
            display: flex;
            gap: 6px;
        }
        .control-btn {
            flex: 1;
            padding: 8px 6px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .control-btn:hover {
            background: #30363d;
            border-color: #58a6ff;
        }
        .control-btn.reset-btn:hover {
            border-color: #ff7b72;
            color: #ff7b72;
        }

        .unit-marker {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }
        .unit-marker:active {
            cursor: grabbing;
        }
        .unit-card {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 10px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.8);
            border: 2px solid #ffffff;
            transition: transform 0.15s ease, background 0.3s;
        }
        .unit-card:hover {
            transform: scale(1.12);
        }
        .unit-blue {
            background: linear-gradient(135deg, #0d59c8, #418bee);
            color: #ffffff;
        }
        .unit-red {
            background: linear-gradient(135deg, #c92a2a, #ff6b6b);
            color: #ffffff;
        }
        .unit-retreated {
            filter: grayscale(0.8);
            opacity: 0.5;
        }
        .unit-label {
            background: rgba(10, 14, 20, 0.9);
            color: #f0f6fc;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 3px;
            margin-top: 3px;
            white-space: nowrap;
            border: 1px solid rgba(240, 246, 252, 0.15);
        }
        .hp-bar-bg {
            width: 38px;
            height: 5px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 3px;
            margin-top: 2px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .hp-bar-fill {
            height: 100%;
            background: #3fb950;
            width: 100%;
            transition: width 0.15s linear, background-color 0.3s;
        }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="app-container">
    <div id="map"></div>
    <canvas id="canvas-overlay"></canvas>

    <div class="ui-panel">
        <h2>ЛБЗ: Мультиплеєр <span id="pulse-dot" style="height:8px;width:8px;background:#3fb950;border-radius:50%;display:inline-block;"></span></h2>
        <p>ЛБЗ пролягає від Херсона вздовж Дніпра до кордону. Прорив зміщує лише локальну ділянку фронту.</p>
        <div class="status-tracker">
            <div class="status-row">
                <span>Дата симуляції:</span>
                <span class="val-date" id="sim-date">01.01.2023</span>
            </div>
            <div class="status-row">
                <span>Швидкість гри:</span>
                <span id="speed-label" style="color:#58a6ff; font-weight:600;">5x (Макс)</span>
            </div>
            <div class="status-row">
                <span>Гравців онлайн:</span>
                <span class="val-blue" id="online-players">1</span>
            </div>
            <div class="status-row">
                <span>Стан боїв:</span>
                <span id="combat-status" style="color:#d29922;">Спостереження</span>
            </div>
        </div>

        <!-- Кнопки швидкості: Пауза, 1x, 2x, 5x -->
        <div class="speed-controls">
            <button class="speed-btn" id="btn-speed-0" onclick="setGameSpeed(0)">⏸ Пауза</button>
            <button class="speed-btn" id="btn-speed-1" onclick="setGameSpeed(1)">1x</button>
            <button class="speed-btn" id="btn-speed-2" onclick="setGameSpeed(2)">2x</button>
            <button class="speed-btn active" id="btn-speed-5" onclick="setGameSpeed(5)">5x</button>
        </div>

        <div class="action-row">
            <button class="control-btn" id="toggle-ai-btn" onclick="toggleRedAI()">ШІ Ворога: Ручний</button>
            <button class="control-btn reset-btn" onclick="resetFrontline()">↺ Скинути ЛБЗ</button>
        </div>
    </div>
</div>

<!-- Leaflet JS & Turf JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

<script>
    // Ініціалізація Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCeWM1wdHdN6bIXFXTqHXO7WgJNJK53nwk",
        authDomain: "storinka-d7bd6.firebaseapp.com",
        databaseURL: "https://storinka-d7bd6-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "storinka-d7bd6",
        storageBucket: "storinka-d7bd6.appspot.com",
        messagingSenderId: "317173750408",
        appId: "1:317173750408:web:62d09563fc750e20589d3d",
        measurementId: "G-5HX3ES92NE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const gameRef = db.ref('multiplayer_lbz_session_v3');

    // Облік гравців онлайн
    const presenceRef = db.ref('multiplayer_presence_v3');
    const myPresenceRef = presenceRef.push();

    db.ref('.info/connected').on('value', (snapshot) => {
        if (snapshot.val() === true) {
            myPresenceRef.onDisconnect().remove();
            myPresenceRef.set({ timestamp: firebase.database.ServerValue.TIMESTAMP });
        }
    });

    presenceRef.on('value', (snapshot) => {
        let count = 0;
        snapshot.forEach(() => { count++; });
        const el = document.getElementById('online-players');
        if (el) el.innerText = Math.max(1, count);
    });

    // 1. ІНІЦІАЛІЗАЦІЯ КАРТИ (Охоплює від Херсона до Харківщини)
    const map = L.map('map', {
        center: [48.1, 35.8],
        zoom: 6,
        minZoom: 6,
        maxZoom: 12,
        zoomControl: false
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 18
    }).addTo(map);

    // 2. ДЕТАЛІЗОВАНА ЛІНІЯ ФРОНТУ ВІД ЧОРНОГО МОРЯ / ХЕРСОНА ПО ДНІПРУ ДО КОРДОНУ РФ
    const initialFrontlinePoints = [
        [46.52, 31.85], // Дніпровсько-Бузький лиман / Кінбурн
        [46.63, 32.65], // Херсон / Антонівський міст
        [46.74, 33.12], // Кринки / Тягинка
        [46.82, 33.42], // Нова Каховка
        [47.08, 33.75], // Берислав / Велика Лепетиха
        [47.36, 34.18], // Верхній Рогачик / Нікополь
        [47.50, 34.65], // Енергодар / Кам'янка-Дніпровська
        [47.42, 35.25], // Василівка / Каховське водосховище
        [47.48, 35.80], // Оріхів
        [47.65, 36.25], // Гуляйполе
        [47.77, 36.85], // Вугледар
        [47.98, 37.50], // Мар'їнка
        [48.13, 37.75], // Авдіївка
        [48.60, 38.00], // Бахмут
        [48.95, 38.10], // Кремінна
        [49.40, 38.00], // Сватівський сектор
        [49.70, 37.60], // Куп'янськ
        [49.95, 37.70], // Дворічна
        [50.25, 36.90], // Вовчанськ
        [50.45, 36.60]  // Кордон з РФ
    ];

    let currentFrontlinePoints = initialFrontlinePoints.map(pt => [...pt]);

    map.createPane('controlZonesPane');
    map.getPane('controlZonesPane').style.zIndex = 350;

    let redZoneLayer = L.polygon([], {
        color: 'transparent',
        fillColor: '#da3633',
        fillOpacity: 0.28,
        pane: 'controlZonesPane'
    }).addTo(map);

    let blueZoneLayer = L.polygon([], {
        color: 'transparent',
        fillColor: '#1f6beb',
        fillOpacity: 0.24,
        pane: 'controlZonesPane'
    }).addTo(map);

    let frontlinePolyline = L.polyline([], {
        color: '#ff4d4d',
        weight: 4,
        dashArray: '8, 6',
        lineCap: 'round'
    }).addTo(map);

    // 3. ПІДРОЗДІЛИ (Додано Херсонський напрямок по Дніпру)
    let isRedAIEnabled = false;
    let gameSpeed = 5;
    let simDate = new Date(2023, 0, 1);
    let dateAccumulator = 0;
    let lastFrameTime = performance.now();
    let localDraggingId = null;
    let lastFrontlineSync = 0;

    const initialUnitsData = [
        // ЗСУ (Сині)
        { id: 'b_kh1', name: '35 ОБрМП', side: 'blue', lat: 46.72, lng: 32.55, power: 100, hp: 100, range: 0.65, status: 'active' },
        { id: 'b_kh2', name: '124 ОБрТрО', side: 'blue', lat: 47.05, lng: 33.45, power: 90, hp: 100, range: 0.65, status: 'active' },
        { id: 'b1', name: '47 ОМБр', side: 'blue', lat: 47.55, lng: 35.65, power: 100, hp: 100, range: 0.75, status: 'active' },
        { id: 'b4', name: '72 ОМБр', side: 'blue', lat: 47.82, lng: 36.65, power: 95, hp: 100, range: 0.75, status: 'active' },
        { id: 'b2', name: '3 ОШБр', side: 'blue', lat: 48.55, lng: 37.65, power: 100, hp: 100, range: 0.75, status: 'active' },
        { id: 'b3', name: '80 ДШБр', side: 'blue', lat: 49.30, lng: 37.55, power: 95, hp: 100, range: 0.75, status: 'active' },
        { id: 'b5', name: '92 ОШБр', side: 'blue', lat: 50.10, lng: 36.55, power: 95, hp: 100, range: 0.75, status: 'active' },

        // ВС РФ (Червоні)
        { id: 'r_kh1', name: '18 ЗВА', side: 'red', lat: 46.55, lng: 32.95, power: 90, hp: 100, range: 0.65, status: 'active' },
        { id: 'r_kh2', name: '7 ДШД', side: 'red', lat: 46.95, lng: 33.95, power: 90, hp: 100, range: 0.65, status: 'active' },
        { id: 'r1', name: '58 ЗВА', side: 'red', lat: 47.38, lng: 35.95, power: 90, hp: 100, range: 0.70, status: 'active' },
        { id: 'r2', name: '1 АК', side: 'red', lat: 48.10, lng: 38.05, power: 90, hp: 100, range: 0.70, status: 'active' },
        { id: 'r3', name: '2 АК', side: 'red', lat: 48.80, lng: 38.40, power: 90, hp: 100, range: 0.70, status: 'active' },
        { id: 'r4', name: '1 ТА', side: 'red', lat: 49.70, lng: 38.20, power: 90, hp: 100, range: 0.70, status: 'active' }
    ];

    let units = initialUnitsData.map(u => ({ ...u }));
    let unitMarkers = {};

    // Ініціалізація або завантаження сесії з Firebase
    gameRef.once('value', (snapshot) => {
        if (!snapshot.exists()) {
            syncFullStateToFirebase();
        }
    });

    function syncFullStateToFirebase() {
        let initUnits = {};
        units.forEach(u => {
            initUnits[u.id] = { lat: u.lat, lng: u.lng, hp: u.hp, status: u.status };
        });
        gameRef.set({
            units: initUnits,
            frontline: currentFrontlinePoints
        });
    }

    // Синхронізація юнітів від інших гравців
    gameRef.child('units').on('value', (snapshot) => {
        if (!snapshot.exists()) return;
        const remoteUnits = snapshot.val();
        units.forEach(u => {
            if (remoteUnits[u.id]) {
                const ru = remoteUnits[u.id];
                u.hp = ru.hp;
                u.status = ru.status;
                updateHpBar(u);

                const card = document.getElementById(`card-${u.id}`);
                if (card) {
                    if (u.status === 'retreated') card.classList.add('unit-retreated');
                    else card.classList.remove('unit-retreated');
                }

                if (localDraggingId !== u.id) {
                    if (Math.abs(u.lat - ru.lat) > 0.0005 || Math.abs(u.lng - ru.lng) > 0.0005) {
                        u.lat = ru.lat;
                        u.lng = ru.lng;
                        if (unitMarkers[u.id]) {
                            unitMarkers[u.id].setLatLng([u.lat, u.lng]);
                        }
                    }
                }
            }
        });
    });

    // Синхронізація лінії фронту від інших гравців
    gameRef.child('frontline').on('value', (snapshot) => {
        if (!snapshot.exists() || localDraggingId !== null) return;
        const remoteFrontline = snapshot.val();
        if (Array.isArray(remoteFrontline) && remoteFrontline.length === currentFrontlinePoints.length) {
            currentFrontlinePoints = remoteFrontline.map(pt => [...pt]);
            renderSmoothedFrontline(currentFrontlinePoints);
        }
    });

    function resetFrontline() {
        currentFrontlinePoints = initialFrontlinePoints.map(pt => [...pt]);
        units = initialUnitsData.map(u => ({ ...u }));
        units.forEach(u => {
            if (unitMarkers[u.id]) {
                unitMarkers[u.id].setLatLng([u.lat, u.lng]);
            }
            const card = document.getElementById(`card-${u.id}`);
            if (card) card.classList.remove('unit-retreated');
            updateHpBar(u);
        });
        renderSmoothedFrontline(currentFrontlinePoints);
        syncFullStateToFirebase();
    }

    function createUnitMarkers() {
        units.forEach(u => {
            const isBlue = u.side === 'blue';
            const iconHtml = `
                <div class="unit-marker" id="marker-cont-${u.id}">
                    <div class="unit-card ${isBlue ? 'unit-blue' : 'unit-red'}" id="card-${u.id}">
                        ${isBlue ? 'ЗСУ' : 'ВС'}
                    </div>
                    <div class="unit-label">${u.name}</div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-${u.id}" style="width: ${u.hp}%"></div></div>
                </div>
            `;

            const customIcon = L.divIcon({
                html: iconHtml,
                className: '',
                iconSize: [46, 56],
                iconAnchor: [23, 28]
            });

            const marker = L.marker([u.lat, u.lng], {
                icon: customIcon,
                draggable: true
            }).addTo(map);

            marker.on('dragstart', function() {
                localDraggingId = u.id;
            });

            marker.on('drag', function(e) {
                if (u.status === 'retreated') return;
                const newLatLng = e.target.getLatLng();
                u.lat = newLatLng.lat;
                u.lng = newLatLng.lng;
                updateFrontlineTerritory(0.45, true);

                gameRef.child('units/' + u.id).update({
                    lat: u.lat,
                    lng: u.lng,
                    hp: u.hp,
                    status: u.status
                });
            });

            marker.on('dragend', function() {
                localDraggingId = null;
                updateFrontlineTerritory(0.6, true);
                gameRef.child('units/' + u.id).update({
                    lat: u.lat,
                    lng: u.lng,
                    hp: u.hp,
                    status: u.status
                });
                gameRef.child('frontline').set(currentFrontlinePoints);
            });

            unitMarkers[u.id] = marker;
        });
    }

    function toggleRedAI() {
        isRedAIEnabled = !isRedAIEnabled;
        const btn = document.getElementById('toggle-ai-btn');
        if (btn) {
            btn.innerText = isRedAIEnabled ? 'ШІ Ворога: Авто' : 'ШІ Ворога: Ручний';
            btn.style.color = isRedAIEnabled ? '#ff7b72' : '#c9d1d9';
            btn.style.borderColor = isRedAIEnabled ? '#ff7b72' : '#30363d';
        }
    }

    function setGameSpeed(speed) {
        gameSpeed = speed;
        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.classList.remove('active', 'paused-active');
        });

        const activeBtn = document.getElementById(`btn-speed-${speed}`);
        const pulseDot = document.getElementById('pulse-dot');
        const speedLabel = document.getElementById('speed-label');
        const combatStatusEl = document.getElementById('combat-status');

        if (speed === 0) {
            activeBtn.classList.add('paused-active');
            if (pulseDot) pulseDot.style.background = '#d29922';
            if (speedLabel) {
                speedLabel.innerText = 'Пауза';
                speedLabel.style.color = '#d29922';
            }
            if (combatStatusEl) {
                combatStatusEl.innerText = 'Пауза';
                combatStatusEl.style.color = '#d29922';
            }
        } else {
            activeBtn.classList.add('active');
            if (pulseDot) pulseDot.style.background = '#3fb950';
            if (speedLabel) {
                speedLabel.style.color = '#58a6ff';
                if (speed === 1) speedLabel.innerText = '1x (Повільно)';
                if (speed === 2) speedLabel.innerText = '2x (Середньо)';
                if (speed === 5) speedLabel.innerText = '5x (Макс)';
            }
        }
    }

    // 4. ЛОКАЛЬНИЙ СЕКТОРНИЙ РУХ ЛБЗ (Рухається лише ділянка прориву, решта фронту нерухома)
    function updateFrontlineTerritory(captureRate = 0.05, forceRender = false) {
        const activeBlues = units.filter(u => u.side === 'blue' && u.status === 'active');
        const activeReds = units.filter(u => u.side === 'red' && u.status === 'active');

        let changed = false;

        for (let i = 0; i < currentFrontlinePoints.length; i++) {
            let ptLat = currentFrontlinePoints[i][0];
            let ptLng = currentFrontlinePoints[i][1];
            let originalLng = ptLng;

            // Перевіряємо просування ЗСУ (на схід / південний схід через Дніпро)
            activeBlues.forEach(b => {
                let dist = Math.hypot(ptLat - b.lat, ptLng - b.lng);
                // Вузький радіус впливу (0.52 градуса), щоб рухалась ТІЛЬКИ локальна ділянка!
                if (dist < 0.52 && b.lng > ptLng - 0.06) {
                    let isBlockedByRed = activeReds.some(r => Math.hypot(r.lat - b.lat, r.lng - b.lng) < 0.35 && r.hp > 25);
                    if (!isBlockedByRed) {
                        // Гаусове затухання: максимум у центрі підрозділу, нуль на краях ділянки
                        let localWeight = Math.exp(-(dist * dist) / (2 * 0.18 * 0.18));
                        let targetLng = b.lng + 0.09;
                        if (targetLng > ptLng) {
                            ptLng += (targetLng - ptLng) * captureRate * localWeight;
                        }
                    }
                }
            });

            // Перевіряємо просування ВС РФ (на захід / північний захід)
            activeReds.forEach(r => {
                let dist = Math.hypot(ptLat - r.lat, ptLng - r.lng);
                if (dist < 0.52 && r.lng < ptLng + 0.06) {
                    let isBlockedByBlue = activeBlues.some(b => Math.hypot(b.lat - r.lat, b.lng - r.lng) < 0.35 && b.hp > 25);
                    if (!isBlockedByBlue) {
                        let localWeight = Math.exp(-(dist * dist) / (2 * 0.18 * 0.18));
                        let targetLng = r.lng - 0.09;
                        if (targetLng < ptLng) {
                            ptLng += (targetLng - ptLng) * captureRate * localWeight;
                        }
                    }
                }
            });

            if (Math.abs(ptLng - originalLng) > 0.0001) {
                currentFrontlinePoints[i][1] = ptLng;
                changed = true;
            }
        }

        if (changed || forceRender) {
            renderSmoothedFrontline(currentFrontlinePoints);

            // Періодично синхронізуємо лінію фронту в Firebase
            const now = Date.now();
            if (now - lastFrontlineSync > 1200) {
                lastFrontlineSync = now;
                gameRef.child('frontline').set(currentFrontlinePoints);
            }
        }
    }

    function renderSmoothedFrontline(points) {
        let geojsonCoords = points.map(p => [p[1], p[0]]);
        let lineFeature = turf.lineString(geojsonCoords);

        // Помірна різкість (0.62) зберігає природну форму Дніпра та чіткі локальні плацдарми
        let smoothed = turf.bezierSpline(lineFeature, {
            resolution: 14000,
            sharpness: 0.62
        });

        let leafletCoords = smoothed.geometry.coordinates.map(c => [c[1], c[0]]);
        frontlinePolyline.setLatLngs(leafletCoords);

        // Закриваємо полігони контролю далеко за межами карти
        let firstPt = leafletCoords[0]; // Херсон / Чорне море
        let lastPt = leafletCoords[leafletCoords.length - 1]; // Північний кордон РФ

        let redPolygonCoords = [
            ...leafletCoords,
            [lastPt[0] + 2.0, 58.0],
            [40.0, 58.0],
            [40.0, firstPt[1]],
            firstPt
        ];
        redZoneLayer.setLatLngs(redPolygonCoords);

        let bluePolygonCoords = [
            ...leafletCoords.slice().reverse(),
            [firstPt[0] - 2.0, 20.0],
            [56.0, 20.0],
            [56.0, lastPt[1]],
            lastPt
        ];
        blueZoneLayer.setLatLngs(bluePolygonCoords);
    }

    // 5. ДИНАМІКА БОЇВ ТА CANVAS
    const canvas = document.getElementById('canvas-overlay');
    const ctx = canvas.getContext('2d');
    let projectiles = [];
    let explosions = [];

    function resizeCanvas() {
        if (!canvas) return;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function updateHpBar(unit) {
        const bar = document.getElementById(`hp-${unit.id}`);
        if (bar) {
            bar.style.width = `${Math.max(0, unit.hp)}%`;
            if (unit.hp < 30) {
                bar.style.backgroundColor = '#ff4d4d';
            } else if (unit.hp < 60) {
                bar.style.backgroundColor = '#d29922';
            } else {
                bar.style.backgroundColor = '#3fb950';
            }
        }
    }

    function handleRetreat(unit) {
        if (unit.status === 'retreated') return;
        unit.status = 'retreated';

        const card = document.getElementById(`card-${unit.id}`);
        if (card) card.classList.add('unit-retreated');

        const retreatDist = 0.25;
        if (unit.side === 'blue') {
            unit.lng -= retreatDist;
        } else {
            unit.lng += retreatDist;
        }

        if (unitMarkers[unit.id]) {
            unitMarkers[unit.id].setLatLng([unit.lat, unit.lng]);
        }

        let recoverInterval = setInterval(() => {
            if (gameSpeed === 0) return;
            const speedMult = gameSpeed / 5;
            unit.hp += 20 * speedMult;
            if (unit.hp >= 100) {
                unit.hp = 100;
                unit.status = 'active';
                if (card) card.classList.remove('unit-retreated');
                clearInterval(recoverInterval);
                updateFrontlineTerritory(0.25, true);
            }
            updateHpBar(unit);
            
            if (localDraggingId === null) {
                gameRef.child('units/' + unit.id).update({ hp: unit.hp, status: unit.status, lng: unit.lng });
            }
        }, 1000);
    }

    function triggerFirefight(uBlue, uRed, speedMult) {
        if (uBlue.status !== 'active' || uRed.status !== 'active') return;

        let p1 = map.latLngToContainerPoint([uBlue.lat, uBlue.lng]);
        let p2 = map.latLngToContainerPoint([uRed.lat, uRed.lng]);

        if (Math.random() < 0.6 * speedMult) {
            projectiles.push({
                x: p1.x, y: p1.y, targetX: p2.x, targetY: p2.y, progress: 0,
                speed: (0.045 + Math.random() * 0.03) * Math.max(0.4, speedMult), color: '#58a6ff'
            });
        }
        if (Math.random() < 0.5 * speedMult) {
            projectiles.push({
                x: p2.x, y: p2.y, targetX: p1.x, targetY: p1.y, progress: 0,
                speed: (0.045 + Math.random() * 0.03) * Math.max(0.4, speedMult), color: '#ff7b72'
            });
        }

        if (Math.random() < 0.25 * speedMult) {
            uRed.hp -= 3.5;
            uBlue.hp -= 2.0;

            updateHpBar(uRed);
            updateHpBar(uBlue);

            explosions.push({
                x: p2.x + (Math.random() - 0.5) * 20,
                y: p2.y + (Math.random() - 0.5) * 20,
                radius: 2, maxRadius: 12 + Math.random() * 6, alpha: 1
            });

            if (uRed.hp <= 15 && uRed.status === 'active') {
                handleRetreat(uRed);
            }
            if (uBlue.hp <= 15 && uBlue.status === 'active') {
                handleRetreat(uBlue);
            }
        }
    }

    function updateRedAI(speedMult) {
        if (!isRedAIEnabled || gameSpeed === 0) return;

        units.filter(u => u.side === 'red' && u.status === 'active').forEach(r => {
            let closestBlue = null;
            let minDist = 999;
            units.filter(b => b.side === 'blue' && b.status === 'active').forEach(b => {
                let d = Math.hypot(b.lat - r.lat, b.lng - r.lng);
                if (d < minDist) {
                    minDist = d;
                    closestBlue = b;
                }
            });

            if (closestBlue && minDist > 0.35 && minDist < 1.6) {
                r.lat += (closestBlue.lat - r.lat) * 0.004 * speedMult;
                r.lng += (closestBlue.lng - r.lng) * 0.004 * speedMult;
                if (unitMarkers[r.id]) {
                    unitMarkers[r.id].setLatLng([r.lat, r.lng]);
                }
            }
        });
    }

    function animateCombat(now) {
        const dt = (now - lastFrameTime) / 1000;
        lastFrameTime = now;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameSpeed > 0) {
            const speedMult = gameSpeed / 5;

            dateAccumulator += dt * speedMult;
            if (dateAccumulator >= 1.0) {
                const daysToAdd = Math.floor(dateAccumulator);
                dateAccumulator -= daysToAdd;
                simDate.setDate(simDate.getDate() + daysToAdd);

                const day = String(simDate.getDate()).padStart(2, '0');
                const month = String(simDate.getMonth() + 1).padStart(2, '0');
                const year = simDate.getFullYear();
                const dateEl = document.getElementById('sim-date');
                if (dateEl) dateEl.innerText = `${day}.${month}.${year}`;
            }

            updateFrontlineTerritory(0.06 * speedMult, false);

            let activeCombats = 0;
            let blueUnits = units.filter(u => u.side === 'blue' && u.status === 'active');
            let redUnits = units.filter(u => u.side === 'red' && u.status === 'active');

            blueUnits.forEach(b => {
                redUnits.forEach(r => {
                    let dist = Math.hypot(b.lat - r.lat, b.lng - r.lng);
                    if (dist < (b.range + r.range)) {
                        triggerFirefight(b, r, speedMult);
                        activeCombats++;
                    }
                });
            });

            updateRedAI(speedMult);

            const combatStatusEl = document.getElementById('combat-status');
            if (combatStatusEl) {
                if (activeCombats > 0) {
                    combatStatusEl.innerText = `Інтенсивний бій (${activeCombats})`;
                    combatStatusEl.style.color = '#ff7b72';
                } else {
                    combatStatusEl.innerText = 'Спостереження';
                    combatStatusEl.style.color = '#d29922';
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.progress += p.speed;

                let currentX = p.x + (p.targetX - p.x) * p.progress;
                let currentY = p.y + (p.targetY - p.y) * p.progress;

                ctx.beginPath();
                ctx.moveTo(p.x + (p.targetX - p.x) * Math.max(0, p.progress - 0.2), p.y + (p.targetY - p.y) * Math.max(0, p.progress - 0.2));
                ctx.lineTo(currentX, currentY);
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 2.5;
                ctx.stroke();

                if (p.progress >= 1) {
                    explosions.push({ x: p.targetX, y: p.targetY, radius: 2, maxRadius: 10, alpha: 1 });
                    projectiles.splice(i, 1);
                }
            }

            for (let i = explosions.length - 1; i >= 0; i--) {
                let ex = explosions[i];
                ex.radius += 0.8 * Math.max(0.4, speedMult);
                ex.alpha -= 0.06 * Math.max(0.4, speedMult);

                ctx.beginPath();
                ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 140, 0, ${Math.max(0, ex.alpha)})`;
                ctx.fill();

                if (ex.alpha <= 0) explosions.splice(i, 1);
            }
        }

        requestAnimationFrame(animateCombat);
    }

    map.on('move', function() {
        projectiles = [];
        explosions = [];
    });

    // Ініціалізація
    createUnitMarkers();
    renderSmoothedFrontline(currentFrontlinePoints);
    requestAnimationFrame(animateCombat);
</script>
</body>
</html>
