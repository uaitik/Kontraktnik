<!DOCTYPE html>
<html lang="uk-UA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlan Division — Advanced Tactical Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --panel-bg: rgba(10, 15, 26, 0.95);
            --accent: #38bdf8;
            --text: #e2e8f0;
            --heading: #f8fafc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #070b14; color: var(--text); }

        /* TOP PANEL */
        .topbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: var(--panel-bg); backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(56,189,248,0.25);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 2000; gap: 12px;
        }
        .brand {
            font-weight: 800; font-size: 0.95rem; color: var(--heading);
            letter-spacing: 0.5px; white-space: nowrap; display: flex; align-items: center; gap: 8px;
        }
        .stats { display: flex; gap: 8px; flex-wrap: wrap; }
        .stat {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600;
        }
        .stat span { color: var(--accent); }
        .controls { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn {
            padding: 5px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 700;
            border: 1px solid; cursor: pointer; transition: 0.15s; background: transparent; color: var(--text);
        }
        .btn:hover { filter: brightness(1.2); }
        .btn-blue { border-color: #38bdf8; color: #38bdf8; }
        .btn-blue.active, .btn-blue:hover { background: #38bdf8; color: #000; }
        .btn-green { border-color: #22c55e; color: #22c55e; }
        .btn-green:hover { background: #22c55e; color: #000; }
        .btn-red { border-color: #ef4444; color: #f87171; }
        .btn-grey { border-color: #64748b; color: #94a3b8; }

        #map { width: 100vw; height: 100vh; background: #000; }

        /* POPUPS */
        .leaflet-popup-content-wrapper {
            background: #0f172a !important; color: #f1f5f9 !important;
            border: 1px solid rgba(56,189,248,0.3); border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .leaflet-popup-content h3 { color: #38bdf8; margin-bottom: 6px; font-size: 1rem; }
        .leaflet-popup-content p { margin: 4px 0; font-size: 0.84rem; }
        .pbtn {
            display: block; width: 100%; margin-top: 8px; padding: 7px;
            border: none; border-radius: 5px; font-weight: 700; cursor: pointer; color: #fff; font-size: 0.8rem;
            transition: opacity 0.15s;
        }
        .pbtn:hover { opacity: 0.85; }
        .pbtn-attack { background: #ef4444; }
        .pbtn-entrench { background: #64748b; }

        /* LEGEND */
        .legend {
            position: fixed; bottom: 16px; left: 16px; z-index: 1000;
            background: var(--panel-bg); padding: 10px 14px; border-radius: 8px;
            border: 1px solid rgba(56,189,248,0.2); font-size: 0.78rem;
        }
        .legend div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
        .legend-color { width: 14px; height: 10px; border-radius: 2px; }

        /* MODAL */
        .modal-bg {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            z-index: 3000; align-items: center; justify-content: center;
        }
        .modal-bg.open { display: flex; }
        .modal {
            background: #0f172a; border: 1px solid rgba(56,189,248,0.3);
            border-radius: 12px; padding: 22px; width: 340px; max-width: 90vw;
        }
        .modal h3 { color: #38bdf8; margin-bottom: 14px; }
        .modal label { display: block; margin: 10px 0 4px; font-size: 0.85rem; }
        .modal select, .modal input {
            width: 100%; padding: 7px 10px; border-radius: 6px;
            background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
        }
        .modal-actions { margin-top: 18px; display: flex; gap: 8px; justify-content: flex-end; }
    </style>
</head>
<body>

<header class="topbar">
    <div class="brand">🛡️ CARLAN DIVISION</div>

    <div class="stats">
        <div class="stat">Свої: <span id="friendlyPower">0</span></div>
        <div class="stat">Ворог: <span id="enemyPower">0</span></div>
        <div class="stat">Міста ЗСУ: <span id="citiesGreen">0</span>/21</div>
        <div class="stat">Час: <span id="gameTime">00:00</span></div>
    </div>

    <div class="controls">
        <button class="btn btn-blue" onclick="openCreateModal()">➕ Створити підрозділ</button>
        <button class="btn btn-grey" onclick="openSettings()">⚙️ Налаштування</button>
        <button class="btn btn-green" onclick="endTurn()">⏭ Хід</button>
    </div>
</header>

<div id="map"></div>

<div class="legend">
    <div><div class="legend-color" style="background:#166534;"></div> Контроль ЗСУ</div>
    <div><div class="legend-color" style="background:#334155;"></div> Сіра зона</div>
    <div><div class="legend-color" style="background:#7f1d1d;"></div> Окуповано</div>
    <div style="margin-top:6px; font-size:0.72rem; opacity:0.8;">Клікни місто чи район для деталей<br>Перетягуй підрозділи для штурму</div>
</div>

<!-- CREATE UNIT MODAL -->
<div class="modal-bg" id="createModal">
    <div class="modal">
        <h3>Створити новий підрозділ</h3>
        <label>Назва підрозділу</label>
        <input type="text" id="newUnitName" placeholder="Наприклад: 4-й батальйон" value="Добровольчий батальйон">
        <label>Сторона</label>
        <select id="newUnitSide">
            <option value="friendly">Свої (ЗСУ)</option>
            <option value="enemy">Ворог (РФ)</option>
        </select>
        <label>Стартова позиція (Координати кліку або центр)</label>
        <p style="font-size: 0.75rem; color: #94a3b8; margin-top: 4px;">Підрозділ з'явиться в центрі екрана мапи.</p>
        <div class="modal-actions">
            <button class="btn btn-grey" onclick="closeCreateModal()">Скасувати</button>
            <button class="btn btn-blue" onclick="confirmCreateUnit()">Створити</button>
        </div>
    </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-bg" id="settingsModal">
    <div class="modal">
        <h3>Налаштування</h3>
        <label>Складність боїв</label>
        <select id="optDifficulty">
            <option value="0.85">Легко</option>
            <option value="1.0" selected>Нормально</option>
            <option value="1.2">Важко</option>
        </select>
        <div class="modal-actions">
            <button class="btn btn-grey" onclick="closeSettings()">Закрити</button>
            <button class="btn btn-blue" onclick="applySettings()">Зберегти</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let difficulty = 1.0;

    // Супутникова мапа високої чіткості
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.55, 37.5], 7.8);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }).addTo(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, opacity: 0.65 }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const redNames = new Set([
        "Євпаторійський район","Бахчисарайський район","Джанкойський район","Керченський район",
        "Сімферопольський район","Феодосійський район","Ялтинський район","Білогірський район",
        "Красногвардійський район","Красноперекопський район","Ленінський район","Нижньогірський район",
        "Первомайський район","Роздольненський район","Сакський район","Совєтський район","Чорноморський район",
        "Алчевський район","Довжанський район","Луганський район","Ровеньківський район",
        "Сватівський район","Сєвєродонецький район","Старобільський район","Щастинський район",
        "Горлівський район","Донецький район","Кальміуський район","Маріупольський район",
        "Волноваський район","Покровський район","Бердянський район","Мелітопольський район",
        "Пологівський район","Василівський район","Генічеський район","Каховський район",
        "Скадовський район","Херсонський район"
    ]);
    const greyNames = new Set([
        "Бахмутський район","Краматорський район","Лиманський район","Ізюмський район",
        "Куп'янський район","Богодухівський район","Чугуївський район","Синельниківський район",
        "Нікопольський район","Бериславський район","Запорізький район"
    ]);

    function getRayonStatus(name, layer) {
        if (redNames.has(name)) {
            if (name === "Первомайський район") {
                let lat = 48.0;
                try { lat = layer.getBounds().getCenter().lat; } catch(e) {}
                return lat < 46.5 ? 'red' : 'green';
            }
            return 'red';
        }
        if (greyNames.has(name)) return 'grey';
        try {
            const centerLat = layer.getBounds().getCenter().lat;
            if (centerLat < 46.2) return 'red';
        } catch(e) {}
        return 'green';
    }

    function raionStyle(status) {
        if (status === 'red') return { color:'#7f1d1d', weight:1.5, fillColor:'#7f1d1d', fillOpacity:0.04 };
        if (status === 'grey') return { color:'#334155', weight:1.5, fillColor:'#334155', fillOpacity:0.04 };
        return { color:'#14532d', weight:1.5, fillColor:'#166534', fillOpacity:0.04 };
    }

    // Завантаження адміністративних районів
    let rayonLayers = {};
    fetch('https://raw.githubusercontent.com/slawomirmatuszak/ukrainian_geodata/master/rayony.geojson')
        .then(r => r.json())
        .then(geo => {
            geo.features.forEach(f => {
                const props = f.properties || {};
                const name = props.rayon || props.name || props.shapeName || "Невідомий район";
                const tempLayer = L.geoJSON(f);
                const status = getRayonStatus(name, tempLayer);
                
                const layer = L.geoJSON(f, {
                    style: raionStyle(status),
                    onEachFeature: (feature, l) => {
                        l.on('click', (e) => {
                            L.DomEvent.stopPropagation(e);
                            l.bindPopup(`<h3>Адмін-район: ${name}</h3><p>Статус контролю: <b>${statusText(status)}</b></p>`).openPopup();
                        });
                    }
                }).addTo(map);
                rayonLayers[name] = { layer, status };
            });
        });

    const frontCoords = [
        [49.80, 37.90],[49.55, 37.75],[49.30, 37.60],[49.05, 37.70],
        [48.85, 37.85],[48.70, 37.95],[48.55, 37.98],[48.40, 37.90],
        [48.25, 37.78],[48.10, 37.65],[47.95, 37.40],[47.80, 37.15],
        [47.65, 36.80],[47.52, 36.40],[47.42, 36.00],[47.35, 35.70]
    ];
    L.polyline(frontCoords, { color: '#f87171', weight: 4, opacity: 0.9, dashArray: '10 8' }).addTo(map);

    // РЕАЛЬНІ ТЕРИТОРІЇ МІСТ (ПОЛІГОНИ ЗАМІСТЬ КОЛІВ)
    const cities = [
        { id:'bakhmut', name:"Бахмут", status:'red', desc:"Ключовий транспортний вузол.", coords:[[48.62,37.96],[48.63,38.03],[48.56,38.05],[48.55,37.95]] },
        { id:'chasivyar', name:"Часів Яр", status:'grey', desc:"Панівні висоти.", coords:[[48.61,37.81],[48.61,37.86],[48.56,37.84],[48.56,37.80]] },
        { id:'toretsk', name:"Торецьк", status:'grey', desc:"Зона інтенсивних боїв.", coords:[[48.42,37.82],[48.42,37.88],[48.36,37.86],[48.36,37.81]] },
        { id:'avdiivka', name:"Авдіївка", status:'red', desc:"Укріплений район.", coords:[[48.17,37.71],[48.17,37.77],[48.11,37.75],[48.11,37.70]] },
        { id:'kramatorsk', name:"Краматорськ", status:'green', desc:"Адміністративний центр.", coords:[[48.77,37.52],[48.77,37.62],[48.68,37.60],[48.68,37.50]] },
        { id:'sloviansk', name:"Слов'янськ", status:'green', desc:"Оборонний вузол.", coords:[[48.89,37.57],[48.89,37.65],[48.81,37.63],[48.81,37.55]] },
        { id:'kostiantynivka', name:"Костянтинівка", status:'green', desc:"Прифронтовий хаб.", coords:[[48.55,37.67],[48.55,37.74],[48.49,37.72],[48.49,37.66]] },
        { id:'druzhkivka', name:"Дружківка", status:'green', desc:"Тиловий гарнізон.", coords:[[48.65,37.50],[48.65,37.56],[48.59,37.54],[48.59,37.48]] },
        { id:'lyman', name:"Лиман", status:'green', desc:"Залізничний вузол.", coords:[[49.02,37.77],[49.02,37.85],[48.95,37.83],[48.95,37.75]] },
        { id:'izium', name:"Ізюм", status:'green', desc:"Плацдарм на Донці.", coords:[[49.25,37.22],[49.25,37.31],[49.18,37.29],[49.18,37.20]] },
        { id:'kupyansk', name:"Куп'янськ", status:'grey', desc:"Прикордонний рубіж.", coords:[[49.75,37.55],[49.75,37.64],[49.67,37.62],[49.67,37.53]] },
        { id:'pokrovsk', name:"Покровськ", status:'green', desc:"Логістичний хаб.", coords:[[48.31,37.14],[48.31,37.21],[48.25,37.19],[48.25,37.12]] },
        { id:'myrnohrad', name:"Мирноград", status:'green', desc:"Шахтарське місто.", coords:[[48.34,37.23],[48.34,37.29],[48.28,37.27],[48.28,37.21]] },
        { id:'selidove', name:"Селидове", status:'grey', desc:"Зона оборони.", coords:[[48.18,37.28],[48.18,37.34],[48.12,37.32],[48.12,37.26]] },
        { id:'orikhiv', name:"Оріхів", status:'green', desc:"Південний опорний пункт.", coords:[[47.73,35.75],[47.73,35.83],[47.66,35.81],[47.66,35.73]] },
        { id:'huliaipole', name:"Гуляйполе", status:'grey', desc:"Позиційні бої.", coords:[[47.70,36.22],[47.70,36.31],[47.62,36.29],[47.62,36.20]] },
        { id:'robotyne', name:"Роботине", status:'grey', desc:"Звільнений плацдарм.", coords:[[47.47,35.82],[47.47,35.89],[47.42,35.87],[47.42,35.80]] },
        { id:'vuhledar', name:"Вугледар", status:'red', desc:"Висотний укріпрайон.", coords:[[47.81,37.20],[47.81,37.27],[47.74,37.25],[47.74,37.18]] },
        { id:'velykanovoselivka', name:"Велика Новосілка", status:'green', desc:"Західний рубіж.", coords:[[47.87,36.79],[47.87,36.87],[47.81,36.85],[47.81,36.77]] }
    ];

    const cityLayers = {};

    function getCityStyle(s) {
        if (s === 'green') return { color:'#14532d', fillColor:'#166534', fillOpacity:0.35, weight:2 };
        if (s === 'grey')  return { color:'#334155', fillColor:'#475569', fillOpacity:0.30, weight:2 };
        return { color:'#7f1d1d', fillColor:'#991b1b', fillOpacity:0.35, weight:2 };
    }

    function statusText(s) {
        return s === 'green' ? 'Під контролем ЗСУ' : s === 'grey' ? 'Сіра зона / Бої' : 'Тимчасово окуповано';
    }

    function rebuildCities() {
        Object.values(cityLayers).forEach(c => map.removeLayer(c.polygon));

        cities.forEach(c => {
            const polygon = L.polygon(c.coords, {
                ...getCityStyle(c.status),
                interactive: true
            }).addTo(map);

            polygon.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                polygon.bindPopup(`
                    <h3>📍 ${c.name}</h3>
                    <p>Статус: <b>${statusText(c.status)}</b></p>
                    <p style="opacity: 0.85; margin-top: 4px;"><i>${c.desc}</i></p>
                    ${selectedUnit && selectedUnit.side === 'friendly' && c.status !== 'green' ? `
                        <button class="pbtn pbtn-attack" onclick="attackCity('${c.id}')">⚔️ Штурмувати та захопити</button>
                    ` : ''}
                `).openPopup();
            });

            cityLayers[c.id] = { ...c, polygon };
        });
        updatePower();
    }

    function setCityStatus(id, status) {
        const c = cityLayers[id];
        if (!c) return;
        c.status = status;
        const orig = cities.find(x => x.id === id);
        if (orig) orig.status = status;
        c.polygon.setStyle(getCityStyle(status));
        updatePower();
    }

    rebuildCities();

    // ПІДРОЗДІЛИ ТА СИСТЕМА ПЕРЕТЯГУВАННЯ
    const units = [];
    let selectedUnit = null;

    function makeIcon(color, strength) {
        const size = 18;
        return L.divIcon({
            html: `<div style="background:${color};width:${size}px;height:${size}px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px ${color};"></div>`,
            iconSize: [size, size], className: ''
        });
    }

    function createUnit(data) {
        const marker = L.marker([data.lat, data.lng], {
            icon: makeIcon(data.color, data.strength),
            draggable: true
        }).addTo(map);

        const unit = { ...data, marker };

        marker.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            selectedUnit = unit;
            marker.bindPopup(`
                <h3>🛡️ ${unit.name}</h3>
                <p>Сторона: <b>${unit.side === 'friendly' ? 'ЗСУ' : 'Ворог'}</b></p>
                <p>Живучість: <b>${Math.round(unit.strength)}</b> · Мораль: <b>${Math.round(unit.org)}%</b></p>
                <p>Перетягніть мишкою на місто або район для штурму!</p>
            `).openPopup();
        });

        marker.on('dragend', e => {
            const pos = e.target.getLatLng();
            unit.lat = pos.lat;
            unit.lng = pos.lng;

            // Перевіряємо чи потрапив юніт на якесь місто
            cities.forEach(c => {
                const poly = cityLayers[c.id].polygon;
                if (poly.getBounds().contains(pos)) {
                    if (unit.side === 'friendly') {
                        setCityStatus(c.id, 'green');
                        alert(`✅ Підрозділ "${unit.name}" увійшов у ${c.name} і встановив контроль ЗСУ!`);
                    } else {
                        setCityStatus(c.id, 'red');
                    }
                }
            });
            updatePower();
        });

        units.push(unit);
        updatePower();
    }

    window.attackCity = function(cityId) {
        if (!selectedUnit) return;
        const city = cityLayers[cityId];
        setCityStatus(cityId, 'green');
        alert(`✅ Успіх! ${selectedUnit.name} захопив ${city.name}!`);
        updatePower();
    };

    // МОДАЛЬНІ ВІКНА СТВОРЕННЯ ПІДРОЗДІЛУ
    window.openCreateModal = function() {
        document.getElementById('createModal').classList.add('open');
    }
    window.closeCreateModal = function() {
        document.getElementById('createModal').classList.remove('open');
    }
    window.confirmCreateUnit = function() {
        const name = document.getElementById('newUnitName').value || "Новий підрозділ";
        const side = document.getElementById('newUnitSide').value;
        const color = side === 'friendly' ? '#38bdf8' : '#ef4444';
        const center = map.getCenter();

        createUnit({
            id: 'u_' + Date.now(),
            name: name,
            side: side,
            lat: center.lat + (Math.random() - 0.5) * 0.2,
            lng: center.lng + (Math.random() - 0.5) * 0.2,
            strength: 90,
            org: 90,
            color: color
        });
        closeCreateModal();
    }

    function openSettings() { document.getElementById('settingsModal').classList.add('open'); }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
    function applySettings() {
        difficulty = parseFloat(document.getElementById('optDifficulty').value);
        closeSettings();
    }

    function endTurn() {
        units.forEach(u => { if (u.side === 'friendly') u.org = Math.min(100, u.org + 5); });
        updatePower();
        alert('⏭ Хід завершено. Мораль підрозділів відновлено.');
    }

    // СТАРТОВІ ПІДРОЗДІЛИ
    createUnit({ id:'f1', name:"1-й батальйон 'Вовкодав'", side:'friendly', lat:48.70, lng:37.60, strength:95, org:90, color:'#38bdf8' });
    createUnit({ id:'f2', name:"РДК", side:'friendly', lat:47.55, lng:36.10, strength:80, org:95, color:'#eab308' });
    createUnit({ id:'e1', name:"76-а ДШД РФ", side:'enemy', lat:48.35, lng:37.95, strength:98, org:80, color:'#ef4444' });

    function updatePower() {
        let f = 0, e = 0, g = 0;
        units.forEach(u => {
            if (u.side === 'friendly') f += u.strength;
            else e += u.strength;
        });
        Object.values(cityLayers).forEach(c => { if (c.status === 'green') g++; });
        document.getElementById('friendlyPower').textContent = Math.round(f);
        document.getElementById('enemyPower').textContent = Math.round(e);
        document.getElementById('citiesGreen').textContent = g;
    }

    setInterval(() => {
        const n = new Date();
        document.getElementById('gameTime').textContent = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
    }, 1000);
</script>
